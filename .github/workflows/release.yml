name: Release

# Push a version tag to build the Windows executable and publish its artifacts.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+([+-][A-Za-z0-9.-]+)?$') {
            throw "Invalid release tag: $env:GITHUB_REF_NAME"
          }
          $metadata = cargo +stable metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $manifestVersion = ($metadata.packages | Where-Object name -eq 'aztromidi').version
          if ($manifestVersion -ne $version) { throw "Tag must match the Cargo.toml version." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo +stable test --locked --release --target x86_64-pc-windows-msvc

      - name: Build standalone executable
        run: .\build.ps1 -OutputDirectory out\standalone

      - name: Package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:RELEASE_VERSION
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item README.md, LICENSE out/standalone/
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $folder = (Resolve-Path out/standalone).Path
          $zip = Join-Path (Resolve-Path release).Path "AztroMidi-$v-win-x64-standalone.zip"
          [IO.Compression.ZipFile]::CreateFromDirectory($folder, $zip)
          Copy-Item out/standalone/AztroMidi.exe "release/AztroMidi-$v.exe"
          Get-ChildItem release | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:RELEASE_VERSION
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($v))\]").LineNumber
          if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $end = ($rest | Select-String -Pattern '^## \[').LineNumber | Select-Object -First 1
            $notes = if ($end) { $rest[0..($end - 2)] } else { $rest }
          } else {
            $notes = @("See CHANGELOG.md for details.")
          }
          $notes += ""
          $notes += "### Downloads"
          $notes += "- **AztroMidi-$v.exe**: standalone app for Windows 10/11 x64."
          $notes += "- **AztroMidi-$v-win-x64-standalone.zip**: the same app with a starter songs folder."
          $notes += ""
          $notes += "You can verify each download with SHA256SUMS.txt."
          $notes | Set-Content release-notes.md -Encoding utf8

      - uses: softprops/action-gh-release@v2
        with:
          name: AztroMidi ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: release/*
