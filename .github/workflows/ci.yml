name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Format
        run: cargo +stable fmt --all --check

      - name: Lint
        run: cargo +stable clippy --locked --release --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: Build
        run: cargo +stable build --locked --release --target x86_64-pc-windows-msvc

      - name: Test
        run: cargo +stable test --locked --release --target x86_64-pc-windows-msvc
